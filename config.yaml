project:
  name: Humboldt Ocean Watch
  label: Experimental thermal monitoring product

region:
  longitude: [-90.0, -80.0]
  latitude: [-10.0, 0.0]

# Increment 6A geographic registry. The legacy ``region`` block above remains
# the only scientific calculation domain until multidomain SST is implemented.
geography:
  coordinate_convention: "-180_to_180"

  display_domain:
    id: pacific_context
    label: Pacific context
    longitude: [-170.0, -70.0]
    latitude: [-45.0, 10.0]

  analysis_domains:
    pacific_context:
      label: Pacific context
      longitude: [-170.0, -70.0]
      latitude: [-45.0, 10.0]
      target_resolution_degrees: 0.25
    humboldt_coastal:
      label: Humboldt coastal system
      longitude: [-85.0, -70.0]
      latitude: [-45.0, 2.0]
      target_resolution_degrees: 0.05
    south_pacific_high:
      label: South Pacific High diagnostic domain
      longitude: [-120.0, -70.0]
      latitude: [-45.0, -15.0]
      target_resolution_degrees: 0.25

  standard_regions:
    nino34:
      label: Niño 3.4
      aliases: [nino34, nino_3_4]
      geometry_type: rectangle
      longitude: [-170.0, -120.0]
      latitude: [-5.0, 5.0]
    nino3:
      label: Niño 3
      aliases: [nino3, nino_3]
      geometry_type: rectangle
      longitude: [-150.0, -90.0]
      latitude: [-5.0, 5.0]
    nino12:
      label: Niño 1+2
      aliases: [nino12, nino_1_2, nino1_2, nino_1plus2, nino1plus2, "nino1.2"]
      geometry_type: rectangle
      longitude: [-90.0, -80.0]
      latitude: [-10.0, 0.0]

  coastal_corridors:
    humboldt_60nm:
      label: Humboldt coastal corridor — 60 nautical miles
      geometry_type: geodesic_coastal_buffer
      source_coastline: south_america_pacific_mainland
      coastline_type: continental_mainland_only
      include_islands: false
      latitude_range: [-45.0, 2.0]
      buffer_distance_nm: 60.0
      buffer_distance_km: 111.12
      ocean_only: true

  map_overlays:
    show_standard_regions: true
    show_analysis_domains: true
    show_coastal_corridor: true
    show_labels: true

data:
  live_path: data/live/nino12_sst_nrt.nc
  demo_path: data/demo/synthetic_sst_daily.nc
  input_path: data/demo/synthetic_sst_daily.nc
  metrics_path: data/processed/nino12_daily_metrics.parquet
  processed_path: data/processed/daily_snapshot.nc
  sst_aliases:
    - analysed_sst
    - sst
    - thetao
    - sea_surface_temperature
  demo_days: 10
  demo_seed: 42

outputs:
  figures:
    sst_current: outputs/figures/sst_current.png
    sst_anomaly: outputs/figures/sst_anomaly.png
    sst_zscore: outputs/figures/sst_zscore.png
  metrics: outputs/reports/daily_metrics.json

logging:
  level: INFO

interface:
  default_language: es
  available_languages:
    - es
    - en
  default_view_mode: basic
  show_internal_ids: true

climatology:
  primary_method: daily_smoothed
  reference_start: 1991
  reference_end: 2020
  sampling_half_window_days: 5
  smoothing_window_days: 31
  daily_path: data/climatology/nino12_daily_climatology_1991_2020.nc
  monthly_path: data/climatology/nino12_monthly_climatology_1991_2020.nc
  fallback_method: monthly
  allow_monthly_fallback: true
  allow_synthetic_fallback_with_real_data: false

quality_control:
  expected_frequency: "1D"
  duplicate_policy: "error"
  minimum_valid_coverage: 0.80
  minimum_temporal_observations: 10
  maximum_gap_days: 2
  allow_irregular_intervals: true
  fail_on_unknown_units: true
  output: outputs/analytics/qc_report.json

series_bank:
  variables:
    - sst
    - anomaly
    - zscore
  warm_anomaly_threshold_c: 2.0
  output: outputs/analytics/daily_series_bank.parquet

temporal_features:
  windows_days: [7, 15, 30, 90]
  minimum_observations: 5
  instability_threshold_c: 0.5
  entropy_bins: 10
  spectral_minimum_observations: 30
  output: outputs/analytics/temporal_features.parquet

spatial_features:
  threshold_c: 2.0
  minimum_valid_coverage: 0.80
  connectivity: queen
  minimum_patch_cells: 4
  moran_weights: row_standardized
  local_window_cells: 3
  output: outputs/analytics/spatial_features.parquet

representativeness:
  minimum_coverage: 0.80
  strong_signal_c: 1.0
  weak_signal_c: 0.30
  neutral_band_c: 0.25
  coherent_sign_fraction: 0.75
  heterogeneous_sd_c: 0.75
  minimum_signal_heterogeneity_ratio: 1.0
  dominant_patch_fraction: 0.60
  patch_density_threshold: 0.02
  coexistence_fraction: 0.25
  epsilon: 1.0e-12
  output: outputs/analytics/representativeness.parquet

event_detection:
  source_variable: regional_mean_sst
  source_metric: sst.weighted_mean
  direction: above
  threshold_type: daily_climatological
  climatological_threshold_variable: threshold_p90
  fixed_anomaly_threshold_c: 2.0
  percentile: 0.90
  minimum_duration_days: 5
  allowed_gap_days: 2
  maximum_calendar_gap_days: 1
  minimum_valid_coverage: 0.80
  comparison: inclusive
  severity_bands:
    strong: 1.0
    extreme: 2.0
  events_output: outputs/analytics/univariate_events.parquet
  daily_flags_output: outputs/analytics/univariate_event_daily_flags.parquet
  summary_output: outputs/analytics/univariate_event_summary.json

patch_detection:
  source_variable: anomaly
  direction: above
  threshold_type: fixed
  fixed_threshold: 2.0
  standardized_threshold: 2.0
  climatological_threshold_variable: threshold_p90
  comparison: inclusive
  connectivity: queen
  minimum_patch_cells: 4
  minimum_patch_area_km2: 0.0
  remove_boundary_only_artifacts: false
  save_label_cube: true
  label_compression_level: 4
  patches_output: outputs/analytics/daily_patches.parquet
  daily_summary_output: outputs/analytics/daily_patch_summary.parquet
  labels_output: outputs/analytics/daily_patch_labels.nc
  json_summary_output: outputs/analytics/daily_patch_build_summary.json

patch_tracking:
  maximum_calendar_gap_days: 1
  allow_gap_bridging: false
  maximum_bridge_gap_days: 0
  minimum_iou: 0.05
  minimum_predecessor_overlap: 0.15
  minimum_successor_overlap: 0.15
  allow_distance_fallback: false
  maximum_centroid_distance_km: 100.0
  minimum_area_ratio: 0.25
  maximum_area_ratio: 4.0
  minimum_link_score: 0.10
  score_weights:
    iou: 0.40
    predecessor_overlap: 0.20
    successor_overlap: 0.20
    centroid_proximity: 0.10
    area_similarity: 0.10
  preserve_all_candidate_edges: true
  save_track_label_cube: true
  label_compression_level: 4
  observations_output: outputs/analytics/spatiotemporal_patch_observations.parquet
  edges_output: outputs/analytics/patch_lineage_edges.parquet
  tracks_output: outputs/analytics/spatiotemporal_tracks.parquet
  families_output: outputs/analytics/spatiotemporal_event_families.parquet
  track_labels_output: outputs/analytics/spatiotemporal_track_labels.nc
  track_mapping_output: outputs/analytics/track_id_mapping.parquet
  family_mapping_output: outputs/analytics/event_family_id_mapping.parquet
  json_summary_output: outputs/analytics/spatiotemporal_tracking_summary.json

event_dashboard:
  default_subtab: event_overview
  maximum_table_rows: 500
  maximum_lineage_nodes: 300
  trajectory_maximum_arrows: 25
  show_patch_labels_default: true
  show_patch_centroids_default: true
  show_anomaly_background_default: true
  show_family_tracks_default: true

brief_context:
  schema_version: "1.0.0"
  output_directory: outputs/briefs
  default_analysis_date: latest
  strict_validation: true
  maximum_payload_kb: 150
  recent_windows_days:
    - 1
    - 7
    - 15
    - 30
  maximum_top_patches: 5
  maximum_top_tracks: 5
  maximum_top_families: 3
  stable_change_thresholds:
    mean_sst_c: 0.10
    mean_anomaly_c: 0.10
    warm_area_fraction: 0.02
    valid_coverage: 0.02
    centroid_latitude_degrees: 0.10
    centroid_longitude_degrees: 0.10
  minimum_valid_coverage: 0.80
  include_internal_ids: true
  include_provenance: true
  include_bilingual_labels: true

brief_generation:
  enabled: true
  provider: gemini
  providers:
    gemini:
      model: gemini-3.1-flash-lite
      require_api_key: true
      api_key_environment_variable: GEMINI_API_KEY
      local_generation: false
      structured_output_mode: json
      temperature: 0
      maximum_output_tokens: 3500
      request_timeout_seconds: 300
      maximum_transport_attempts: 3
      retry_initial_seconds: 15
      retry_maximum_seconds: 60
      maximum_repair_attempts: 1
      use_tools: false
      use_search_grounding: false
      include_thoughts: false
      approximate_bytes_per_token: 3.0
      context_warning_fraction: 0.80
    ollama:
      model: qwen3:4b
      base_url: http://localhost:11434
      require_api_key: false
      local_generation: true
      temperature: 0
      think: false
      num_ctx: 65536
      num_predict: 3500
      keep_alive: 5m
      structured_output_mode: json
      attempt_provider_schema: false
      request_timeout_seconds: 600
      maximum_repair_attempts: 1
      approximate_bytes_per_token: 3.0
      context_warning_fraction: 0.80
    openai:
      model: gpt-5.6
      require_api_key: true
      local_generation: false
      reasoning_effort: medium
      text_verbosity: medium
      store: false
      maximum_output_tokens: 3500
      maximum_repair_attempts: 1
  default_language: both
  maximum_generation_attempts: 2
  retry_initial_seconds: 2
  retry_maximum_seconds: 20
  executive_summary_max_words: 180
  section_max_words: 220
  key_message_max_words: 45
  maximum_key_messages: 5
  require_context_validation: true
  require_output_validation: true
  require_cross_language_consistency: true
  allow_tools: false
  allow_web_search: false
  allow_external_knowledge: false
  preserve_previous_valid_outputs: true
  context_schema_version: "1.0.0"
  maximum_context_payload_kb: 150
  minimum_valid_coverage: 0.80
  output_directory: outputs/briefs
  debug_directory: outputs/briefs/debug
  prohibited_claim_patterns:
    official_classification:
      - "clasificacion oficial"
      - "official classification"
    forecast:
      - "\\bforecast"
      - "\\bpredict"
      - "\\bwill\\b"
      - "expected to"
      - "\\bpronostic"
      - "\\bpredec"
      - "se espera que"
    causal_attribution:
      - "caused by"
      - "due to"
      - "driven by"
      - "causad[oa] por"
      - "debido a"
    biological_fisheries_impact:
      - "(?:biological|fishery|fisheries|ecosystem) impact"
      - "impacto (?:biologico|pesquero|ecosistemico)"
    economic_social_impact:
      - "economic impact"
      - "social impact"
      - "impacto economico"
      - "impacto social"
    confidence_probability:
      - "confidence probability"
      - "probability of"
      - "probabilidad de"
    track_water_parcel:
      - "tracks? (?:are|represent) (?:individual )?(?:water parcels?|water masses?)"
      - "tracks? (?:son|representan) (?:parcelas|masas) (?:individuales )?de agua"
    ordinal_representativeness:
      - "representativeness (?:severity|ranking)"
      - "severidad de representatividad"
    external_reference:
      - "https?://"
      - "\\bdoi\\s*:"
      - "\\[[0-9]+\\]"
